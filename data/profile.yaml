    text: "Kept day-to-day ICT operations running through major shifts: Microsoft 365 becoming central, Intune becoming the endpoint standard, virtual collaboration going from occasional to essential. Joiner/mover/leaver, asset lifecycle, Teams/Zoom events, ITIL incident flow."
